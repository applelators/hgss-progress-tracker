<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HGSS Stream Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: transparent;
      font-family: 'DM Sans', system-ui, sans-serif;
      color: #fff;
      padding: 6px;
    }

    /* ── Keyframes ─────────────────────────────────────────────── */

    @keyframes header-in {
      from { opacity: 0; transform: translateY(-8px) scaleY(0.95); }
      to   { opacity: 1; transform: translateY(0)    scaleY(1); }
    }

    @keyframes row-in {
      from { opacity: 0; transform: translateX(-12px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @keyframes panel-exit {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(-5px); }
    }

    @keyframes border-shimmer {
      0%,100% { box-shadow: 0 0 0 0 rgba(94,200,94,0);  border-color: #50b850; }
      50%      { box-shadow: 0 0 12px 2px rgba(94,200,94,0.35); border-color: #72d072; }
    }

    @keyframes sprite-bob {
      0%,100% { transform: translateY(0px); }
      50%      { transform: translateY(-3px); }
    }

    @keyframes rate-glow {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.65; }
    }

    @keyframes caught-pop {
      0%  { transform: scale(0.4); opacity: 0; }
      60% { transform: scale(1.2); opacity: 1; }
      100%{ transform: scale(1);   opacity: 1; }
    }

    @keyframes deco-pulse {
      0%,100% { opacity: 0.7; }
      50%      { opacity: 1; }
    }

    /* ── Exit ──────────────────────────────────────────────────── */
    #panel.exiting {
      animation: panel-exit 0.18s ease-out forwards;
      pointer-events: none;
    }

    /* ── Outer panel ───────────────────────────────────────────── */
    #panel {
      border: 2.5px solid #50b850;
      border-radius: 8px;
      overflow: hidden;
      background: #0e1210;
      animation: border-shimmer 3.5s ease-in-out infinite;
    }

    /* ── Header ────────────────────────────────────────────────── */
    .area-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 7px 14px;
      background: linear-gradient(180deg, #3d8a3d 0%, #2e6e2e 100%);
      border-bottom: 2px solid #50b850;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 19px;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
      letter-spacing: 0.02em;
      animation: header-in 0.38s cubic-bezier(0.2,0.8,0.3,1) both;
    }

    .header-deco {
      font-size: 11px;
      color: #9edb9e;
      flex-shrink: 0;
      animation: deco-pulse 2.8s ease-in-out infinite;
    }
    .header-deco:last-child { animation-delay: 1.4s; }

    /* ── Pokémon list ──────────────────────────────────────────── */
    .poke-list { padding: 2px 0 3px; }

    .poke-row {
      display: flex;
      align-items: center;
      gap: 0;
      padding: 0 10px 0 8px;
      height: 40px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      animation: row-in 0.3s cubic-bezier(0.2,0.8,0.3,1) calc(var(--row-i,0) * 46ms) both;
    }
    .poke-row:last-child { border-bottom: none; }
    .poke-row.alt { background: rgba(255,255,255,0.035); }
    .poke-row.caught { background: rgba(74,183,112,0.1) !important; }

    /* ── Sprite ────────────────────────────────────────────────── */
    .sprite-wrap {
      position: relative;
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      margin-right: 7px;
    }
    .sprite-wrap::before {
      content: '';
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%);
    }
    .sprite {
      width: 36px;
      height: 36px;
      image-rendering: pixelated;
      display: block;
      position: relative;
      animation: sprite-bob 2.6s calc(var(--row-i,0) * 0.37s) ease-in-out infinite;
    }

    /* ── Name ──────────────────────────────────────────────────── */
    .poke-name {
      flex: 1;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.01em;
    }
    .poke-name.hg   { color: #f0c84a; }
    .poke-name.ss   { color: #90c8e8; }
    .poke-name.caught-name { color: #6ae68a; }

    /* ── Rates ─────────────────────────────────────────────────── */
    .rates {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .rate-cell {
      display: flex;
      align-items: center;
      gap: 2px;
      min-width: 44px;
      justify-content: flex-end;
    }

    .rate-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .rate-num.nonzero {
      color: #f0c840;
      animation: rate-glow 3.6s calc(var(--row-i,0) * 0.55s) ease-in-out infinite;
    }
    .rate-num.zero { color: rgba(255,255,255,0.32); }

    .time-icon {
      width: 12px;
      height: 12px;
      object-fit: contain;
      flex-shrink: 0;
    }

    /* ── Caught check ──────────────────────────────────────────── */
    .caught-check {
      font-size: 9px;
      color: #6ae68a;
      font-weight: 700;
      margin-left: 4px;
      animation: caught-pop 0.4s cubic-bezier(0.2,0.8,0.3,1) both;
      flex-shrink: 0;
    }

    /* ── Placeholder ───────────────────────────────────────────── */
    .placeholder {
      color: rgba(255,255,255,0.22);
      text-align: center;
      padding: 36px 20px;
      font-size: 12px;
      line-height: 1.7;
    }
    .no-pokemon {
      color: rgba(255,255,255,0.18);
      font-size: 11px;
      text-align: center;
      padding: 12px;
    }

    /* ── Reduced motion ────────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      #panel          { animation: none !important; }
      .area-header    { animation: none !important; }
      .header-deco    { animation: none !important; }
      .poke-row       { animation: none !important; }
      .sprite         { animation: none !important; }
      .rate-num.nonzero { animation: none !important; }
      .caught-check   { animation: none !important; }
      #panel.exiting  { animation: none !important; opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="panel">
    <div class="placeholder">Loading…</div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script>
    var currentAreaId = null;
    var renderTimer   = null;

    var ICON = {
      morning: 'icons/60px-Morning_Icon_BDSP.png',
      day:     'icons/60px-Day_Icon_BDSP.png',
      night:   'icons/60px-Night_Icon_BDSP.png',
    };

    function getVersion() { return localStorage.getItem('hgss-version') || 'hg'; }
    function getCaught()  {
      try { return JSON.parse(localStorage.getItem('hgss-caught') || '{}'); }
      catch(e) { return {}; }
    }

    function spriteUrl(name) {
      var id = window.__HGSS_DEX_ID && window.__HGSS_DEX_ID[name];
      return id ? 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/' + id + '.png' : '';
    }

    function getRaw(area) {
      if (!area) return [];
      if (area.floors) return area.floors.reduce(function(a,f){ return a.concat(f.pokemon||[]); }, []);
      return area.pokemon || [];
    }

    function groupPokemon(raw, version) {
      var map = new Map();
      raw.forEach(function(p) {
        if (version === 'hg' && p.ssOnly) return;
        if (version === 'ss' && p.hgOnly) return;
        var m = p.method;
        if (m === 'Gift' || m === 'Trade' || m === 'Event') return;
        if (!map.has(p.name)) {
          map.set(p.name, { name:p.name, morning:null, day:null, night:null,
                            hgOnly:!!p.hgOnly, ssOnly:!!p.ssOnly });
        }
        var e = map.get(p.name);
        if (!p.time) { e.morning = e.morning||p.rate; e.day = e.day||p.rate; e.night = e.night||p.rate; }
        else e[p.time] = p.rate;
      });
      return Array.from(map.values());
    }

    // Collapse morning+day into one daytime column for compact 2-column layout
    function daytimeRate(p) {
      if (p.day) return { rate: p.day, icon: ICON.day };
      if (p.morning) return { rate: p.morning, icon: ICON.morning };
      return { rate: null, icon: ICON.day };
    }

    function rateCell(rate, icon) {
      var isZero = !rate || rate === '0%';
      var display = rate || '0%';
      return '<span class="rate-cell">' +
        '<span class="rate-num ' + (isZero ? 'zero' : 'nonzero') + '">' + display + '</span>' +
        '<img class="time-icon" src="' + icon + '" alt="">' +
        '</span>';
    }

    function buildHTML(area, version, caught) {
      var grouped = groupPokemon(getRaw(area), version);

      var headerHtml =
        '<div class="area-header">' +
          '<span class="header-deco">✦</span>' +
          '<span>' + area.name + '</span>' +
          '<span class="header-deco">✦</span>' +
        '</div>';

      if (grouped.length === 0) {
        return headerHtml + '<div class="poke-list"><div class="no-pokemon">No wild Pokémon</div></div>';
      }

      var rows = grouped.map(function(p, i) {
        var isCaught  = !!caught[p.name];
        var dt        = daytimeRate(p);
        var rowCls    = 'poke-row' + (i%2===1?' alt':'') + (isCaught?' caught':'');
        var nameCls   = 'poke-name' +
          (isCaught ? ' caught-name' : p.hgOnly ? ' hg' : p.ssOnly ? ' ss' : '');
        var spr       = spriteUrl(p.name);

        return '<div class="' + rowCls + '" style="--row-i:' + i + '">' +
          '<div class="sprite-wrap">' +
            (spr
              ? '<img class="sprite" src="' + spr + '" alt="' + p.name + '" onerror="this.style.visibility=\'hidden\'">'
              : '<span class="sprite"></span>') +
          '</div>' +
          '<span class="' + nameCls + '">' + p.name + '</span>' +
          '<div class="rates">' +
            rateCell(dt.rate, dt.icon) +
            rateCell(p.night, ICON.night) +
          '</div>' +
          (isCaught ? '<span class="caught-check">✓</span>' : '') +
        '</div>';
      }).join('');

      return headerHtml + '<div class="poke-list">' + rows + '</div>';
    }

    function doRender(areaId) {
      var panel = document.getElementById('panel');
      var areas = window.__HGSS_AREAS;

      if (!areas) {
        panel.innerHTML = '<div class="placeholder">Tracker data not available.<br>Open the tracker first.</div>';
        return;
      }
      if (!areaId) {
        panel.innerHTML = '<div class="placeholder">Select an area in the tracker.</div>';
        return;
      }
      var area = null;
      for (var i=0; i<areas.length; i++) { if (areas[i].id===areaId){area=areas[i];break;} }
      if (!area) { panel.innerHTML = '<div class="placeholder">Area not found.</div>'; return; }

      panel.innerHTML = buildHTML(area, getVersion(), getCaught());
    }

    function renderArea(areaId) {
      var isNew = areaId !== currentAreaId;
      currentAreaId = areaId;
      if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }

      var panel = document.getElementById('panel');
      var hasContent = !!panel.querySelector('.area-header');

      if (isNew && hasContent) {
        panel.classList.add('exiting');
        renderTimer = setTimeout(function() {
          renderTimer = null;
          panel.classList.remove('exiting');
          doRender(areaId);
        }, 185);
      } else {
        doRender(areaId);
      }
    }

    window.addEventListener('storage', function(e) {
      if (e.key === 'hgss-active-area') renderArea(e.newValue);
      if (e.key === 'hgss-caught' || e.key === 'hgss-version') renderArea(currentAreaId);
    });

    fetch('hgss-area-tracker.jsx')
      .then(function(r){ return r.text(); })
      .then(function(jsx){
        var code = Babel.transform(jsx, { presets:['react'] }).code;
        (0,eval)(code);
        renderArea(localStorage.getItem('hgss-active-area'));
      })
      .catch(function(err){
        console.error('Overlay error:', err);
        document.getElementById('panel').innerHTML =
          '<div class="placeholder" style="color:#f88">Failed to load tracker data.<br>' +
          'Run: <code>python3 -m http.server 8080</code></div>';
      });
  </script>
</body>
</html>
